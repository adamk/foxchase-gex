[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "foxchase-gex"
version = "0.1.0"
description = "Open-source local client for the Foxchase Trading GEX dashboard"
requires-python = ">=3.9"
dependencies = [
  "Flask>=3.0,<4",
  "Werkzeug>=3.0,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "portalocker>=3.2,<4",
  "tzdata>=2024.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["gex_client", "gex_client.*"]

[tool.setuptools.package-data]
gex_client = ["templates/*.html", "static/css/*.css", "static/js/*.js"]
