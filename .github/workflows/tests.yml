name: Cross-platform tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=7,<9"
      - name: Import and app startup smoke check
        run: >-
          python -c "import gex_client.schwab; from gex_client.app import app;
          assert app.config['FOXCHASE_GEX_PORT'] == 8765"
      - name: Run test suite
        run: python -m pytest -q
