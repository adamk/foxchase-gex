<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Foxchase GEX Operator Login</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111; color: #eee; font: 16px system-ui, sans-serif; }
    main { width: min(360px, calc(100vw - 40px)); padding: 24px; border: 1px solid #444; border-radius: 8px; background: #191919; }
    label { display: block; margin: 14px 0 6px; }
    input { box-sizing: border-box; width: 100%; padding: 10px; background: #111; color: #eee; border: 1px solid #555; border-radius: 4px; }
    button { margin-top: 18px; padding: 9px 14px; color: #111; background: #d8bf00; border: 0; border-radius: 4px; cursor: pointer; }
    .error { color: #f99; }
  </style>
</head>
<body>
  <main>
    <h1>Operator login</h1>
    {% if error %}<p class="error" role="alert">Login failed.</p>{% endif %}
    <form method="post" action="/operator/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="256" required>
      <label for="password">Password</label>
      <input id="password" type="password" name="password" autocomplete="current-password" maxlength="256" required>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
